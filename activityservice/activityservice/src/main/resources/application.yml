spring:
  application:
    name: activityservice
  data:
    mongodb:
      uri: mongodb://localhost:27017/aiactivityfitness

server:
  port: 8082

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: TRACE